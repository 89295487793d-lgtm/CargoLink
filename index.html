<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b33"><title>CargoLink</title>
<link rel="stylesheet" href="/style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body><main class="app-shell">
<header class="topbar"><div class="brand-mark">CL</div><div><p class="eyebrow">LOGISTICS PLATFORM</p><h1>CargoLink</h1></div></header>
<section class="welcome"><p class="eyebrow">ONE PLATFORM. EVERY SHIPMENT.</p><h2>Логистика<br>в одной платформе</h2><p class="muted">Грузы, транспорт и перевозчики — в одном месте.</p></section>
<section class="primary-actions"><button class="primary" data-action="find">🚚 Найти груз</button><button class="secondary" data-action="create">📦 Разместить заявку</button></section>
<section class="service-grid">
<button class="service-card" data-action="liquid"><span>🛢️</span><strong>Наливные грузы</strong><small>Специализированные перевозки</small></button>
<button class="service-card" data-action="dry"><span>📦</span><strong>Сухие грузы</strong><small>Авто и сборные грузы</small></button>
<button class="service-card" data-action="vehicles"><span>🚛</span><strong>Свободные авто</strong><small>Доступный транспорт</small></button>
<button class="service-card" data-action="profile"><span>👤</span><strong>Мой профиль</strong><small>Контакты и активность</small></button>
</section><footer>Стартовая версия CargoLink · разделы подключаются поэтапно</footer>
</main><script src="/app.js"></script></body></html>
