<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CargoLink</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
<header class="top"><div class="brand-mark">CL</div><div><strong>CargoLink</strong><small>One Platform. Every Shipment.</small></div><button id="profileBtn" class="icon-btn" aria-label="Профиль">●</button></header>
<main id="view" class="view"><section class="welcome"><p class="eyebrow">ЛОГИСТИКА В ОДНОЙ ПЛАТФОРМЕ</p><h1>Каждая перевозка<br><span>под контролем.</span></h1><p>Грузы, транспорт и логистические сервисы в одном месте.</p></section>
<div class="hero-actions"><button class="primary" data-view="loads">🚚 Найти груз</button><button class="secondary" data-view="create-load">＋ Разместить заявку</button></div>
<div class="section-heading"><h2>Сервисы CargoLink</h2><span>Все бесплатно на старте</span></div>
<div class="tiles">
<button data-view="loads" class="tile"><b>◈</b><strong>Наливные грузы</strong><small>Нефтепродукты и жидкости</small></button>
<button data-view="loads-dry" class="tile"><b>▤</b><strong>Сухие грузы</strong><small>Все основные категории</small></button>
<button data-view="vehicles" class="tile"><b>🚛</b><strong>Свободные авто</strong><small>Найти транспорт</small></button>
<button data-view="services" class="tile"><b>⌖</b><strong>Помощь на дорогах</strong><small>АЗС, СТО, шиномонтаж</small></button>
<button data-view="partners" class="tile"><b>◎</b><strong>Партнёры</strong><small>Отзывы и сообщения</small></button>
<button data-view="my-loads" class="tile"><b>▣</b><strong>Мои заявки</strong><small>Статусы и история</small></button>
<button data-view="directions" class="tile"><b>↗</b><strong>Направления</strong><small>Популярные маршруты</small></button>
<button data-view="analytics" class="tile"><b>⌁</b><strong>Аналитика ставок</strong><small>Без выдуманных данных</small></button>
</div></main>
<nav class="bottom-nav"><button data-view="home" class="active">Главная</button><button data-view="loads">Грузы</button><button data-view="create-load">＋ Заявка</button><button data-view="vehicles">Авто</button><button data-view="profile">Профиль</button></nav>
</div>
<script src="/static/app.js"></script>
</body></html>
